<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title id="t">How note extraction works</title>
<desc id="d">Four steps: you give a made-up or de-identified note, the values are pulled out with the exact words they came from, a second agent re-checks them against the note, and you review a page with the note beside the values.</desc>
<rect width="1200" height="330" rx="14" fill="#fdf5ee"/>
<text x="30" y="44" font-size="20" font-weight="700" fill="#2b2320">From a clinical note to checked values</text>
<rect x="30" y="74" width="252" height="190" rx="10" fill="#ffffff" stroke="#2b2320" stroke-width="1.5"/>
<circle cx="60" cy="108" r="15" fill="#c2452d"/><text x="60" y="114" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="48" y="158" font-size="17" font-weight="700" fill="#2b2320">You give it a note</text>
<text x="48" y="188" font-size="15" fill="#5c4f48">A made-up or de-identified</text>
<text x="48" y="211" font-size="15" fill="#5c4f48">note, saved as a file. You</text>
<text x="48" y="234" font-size="15" fill="#5c4f48">confirm it isn't real data.</text>
<path d="M290 169.0 h22 m-8 -7 l8 7 l-8 7" fill="none" stroke="#c2452d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="326" y="74" width="252" height="190" rx="10" fill="#ffffff" stroke="#2b2320" stroke-width="1.5"/>
<circle cx="356" cy="108" r="15" fill="#c2452d"/><text x="356" y="114" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="344" y="158" font-size="17" font-weight="700" fill="#2b2320">Values are pulled out</text>
<text x="344" y="188" font-size="15" fill="#5c4f48">Each value keeps</text>
<text x="344" y="211" font-size="15" fill="#5c4f48">the exact words</text>
<text x="344" y="234" font-size="15" fill="#5c4f48">it came from.</text>
<path d="M586 169.0 h22 m-8 -7 l8 7 l-8 7" fill="none" stroke="#c2452d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="622" y="74" width="252" height="190" rx="10" fill="#ffffff" stroke="#2b2320" stroke-width="1.5"/>
<circle cx="652" cy="108" r="15" fill="#c2452d"/><text x="652" y="114" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="640" y="158" font-size="17" font-weight="700" fill="#2b2320">A second agent re-checks</text>
<text x="640" y="188" font-size="15" fill="#5c4f48">It reads the saved note</text>
<text x="640" y="211" font-size="15" fill="#5c4f48">afresh. You accept or</text>
<text x="640" y="234" font-size="15" fill="#5c4f48">reject its corrections.</text>
<path d="M882 169.0 h22 m-8 -7 l8 7 l-8 7" fill="none" stroke="#c2452d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="918" y="74" width="252" height="190" rx="10" fill="#ffffff" stroke="#2b2320" stroke-width="1.5"/>
<circle cx="948" cy="108" r="15" fill="#c2452d"/><text x="948" y="114" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="936" y="158" font-size="17" font-weight="700" fill="#2b2320">You review the page</text>
<text x="936" y="188" font-size="15" fill="#5c4f48">The note beside the values.</text>
<text x="936" y="211" font-size="15" fill="#5c4f48">Anything unmatched goes</text>
<text x="936" y="234" font-size="15" fill="#5c4f48">under Needs review.</text>
<text x="600.0" y="306" font-size="16" fill="#2b2320" text-anchor="middle">Extraction only: values are quoted, never interpreted or calculated.</text>
</svg>
