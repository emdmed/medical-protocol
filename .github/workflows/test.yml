name: test

on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, lts/*]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      # bundles and skill reference/ copies must be committed, with no CRLF noise
      - run: npm run build
      - run: node packages/medical-protocol/build.mjs
      - run: git diff --exit-code
